async function refreshAppWeight(){
  try{
    const res = await fetch("./index.html", { cache: "no-store" });
    const blob = await res.blob();
    const kb = (blob.size / 1024).toFixed(1);
    const el = document.getElementById("app-weight");
    if (el) el.textContent = kb + " Ko";
  } catch(e){
    const el = document.getElementById("app-weight");
    if (el) el.textContent = "Indisponible";
  }
}

/* ============ FORMULAIRES : COMPTES ============ */
function openAccountForm(existingId){
  const accounts = getAccounts();
  const acc = accounts.find(a => a.id === existingId);
  const colorSwatches = ACCOUNT_COLORS.map(c =>
    '<div class="swatch ' + (acc && acc.couleur===c || (!acc && c===ACCOUNT_COLORS[0]) ? 'selected' : '') + '" style="background:' + c + '" data-color="' + c + '" onclick="selectSwatch(this)"></div>'
  ).join("");

  openModal(
    '<h3>' + (acc ? "Modifier le compte" : "Ajouter un compte") + '</h3>' +
    '<div class="field"><label>Nom du compte</label><input type="text" id="f-nom" value="' + (acc ? escapeAttr(acc.nom) : '') + '" placeholder="Ex. Livret A"></div>' +
    '<div class="field-row">' +
      '<div class="field"><label>Type</label><select id="f-type">' +
        ["Courant","Épargne","Livret","Assurance vie","Autre"].map(t => '<option ' + (acc && acc.type===t ? 'selected':'') + '>' + t + '</option>').join("") +
      '</select></div>' +
      '<div class="field"><label>Statut</label><select id="f-statut">' +
        '<option value="actif" ' + ((!acc || acc.statut !== "inactif") ? "selected" : "") + '>Actif</option>' +
        '<option value="inactif" ' + (acc && acc.statut === "inactif" ? "selected" : "") + '>Inactif</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="field"><label>Couleur</label><div class="swatches">' + colorSwatches + '</div></div>' +
    '<div class="modal-actions">' +
      '<button class="btn" onclick="closeModal()">Annuler</button>' +
      '<button class="btn btn-primary" data-action="save-account" data-id="' + (existingId||'') + '">Enregistrer</button>' +
    '</div>'
  );
}
function selectSwatch(el){
  el.parentElement.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
}
function saveAccount(existingId){
  const nom = document.getElementById("f-nom").value.trim();
  const type = document.getElementById("f-type").value;
  const statut = document.getElementById("f-statut").value;
  const colorEl = document.querySelector(".swatch.selected");
  const couleur = colorEl ? colorEl.dataset.color : ACCOUNT_COLORS[0];
  if (!nom) { toast("Le nom du compte est requis.", "error"); return; }
  let accounts = getAccounts();
  if (existingId) {
    accounts = accounts.map(a => a.id === existingId ? { ...a, nom, type, couleur, statut } : a);
    toast("Compte modifié.", "success");
  } else {
    accounts.push({ id: uid("acc"), nom, type, couleur, statut });
    toast("Compte ajouté.", "success");
  }
  setAccounts(accounts);
  syncAfterChange();
  closeModal();
  render();
}
function toggleAccountStatus(id){
  let accounts = getAccounts();
  accounts = accounts.map(a => a.id === id ? { ...a, statut: (a.statut === "inactif" ? "actif" : "inactif") } : a);
  setAccounts(accounts);
  syncAfterChange();
  render();
}

function toggleAccountChartVisibility(id){
  let accounts = getAccounts();
  accounts = accounts.map(a => a.id === id ? { ...a, courbeMasquee: !a.courbeMasquee } : a);
  setAccounts(accounts);
  syncAfterChange();
  render();
}

/* ============ RÉORDONNER LES COLONNES DE COMPTES (Mois) ============ */
function openReorderAccountsForm(){
  const accounts = getAccounts();
  const rows = accounts.map((a, i) =>
    '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)">' +
      '<span class="account-swatch" style="background:' + a.couleur + '"></span>' +
      '<span style="flex:1;font-size:13.5px">' + a.nom + '</span>' +
      '<button class="btn-ghost btn-sm" data-action="move-account-up" data-id="' + a.id + '" ' + (i === 0 ? 'disabled style="opacity:0.3"' : '') + ' aria-label="Monter">' +
        '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>' +
      '</button>' +
      '<button class="btn-ghost btn-sm" data-action="move-account-down" data-id="' + a.id + '" ' + (i === accounts.length-1 ? 'disabled style="opacity:0.3"' : '') + ' aria-label="Descendre">' +
        '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>' +
      '</button>' +
    '</div>'
  ).join("");
  openModal(
    '<h3>Ordre des colonnes</h3>' +
    '<p style="font-size:12.5px;color:var(--muted);margin:0 0 0.8rem">Cet ordre s\'applique aux colonnes du tableau Mois, à la liste des comptes et à l\'ordre des courbes sur la page Comptes.</p>' +
    '<div id="reorder-list">' + rows + '</div>' +
    '<div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Fermer</button></div>'
  );
}
function moveAccount(id, direction){
  let accounts = getAccounts();
  const i = accounts.findIndex(a => a.id === id);
  const j = i + direction;
  if (i < 0 || j < 0 || j >= accounts.length) return;
  [accounts[i], accounts[j]] = [accounts[j], accounts[i]];
  setAccounts(accounts);
  syncAfterChange();
  openReorderAccountsForm();
  render();
}

function deleteAccount(id){
  openModal(
    '<h3>Supprimer ce compte ?</h3>' +
    '<p style="font-size:13.5px;color:var(--ink-soft)">Les valeurs enregistrées pour ce compte dans l\'historique des mois seront conservées mais ne seront plus affichées.</p>' +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button>' +
    '<button class="btn btn-danger" data-action="confirm-delete-account" data-id="' + id + '">Supprimer</button></div>'
  );
}
function confirmDeleteAccount(id){
  setAccounts(getAccounts().filter(a => a.id !== id));
  syncAfterChange();
  toast("Compte supprimé.", "success");
  closeModal();
  render();
}

/* ============ FORMULAIRES : MOIS ============ */
function openMonthForm(date){
  const accounts = getAccounts();
  const snapshots = getSnapshots();
  const existingSnap = snapshots.find(s => s.date === date);
  const prevSnap = snapshots.filter(s => s.date < date).sort((a,b)=>b.date.localeCompare(a.date))[0];

  const accountFields = accounts.map(a => {
    const val = existingSnap ? existingSnap.valeurs[a.id] : (prevSnap ? prevSnap.valeurs[a.id] : "");
    const display = (val !== undefined && val !== "") ? formatFrenchNumber(Number(val)) : "";
    return '<div class="field"><label><span class="account-swatch" style="background:' + a.couleur + '"></span>' + a.nom + '</label>' +
      '<input type="text" inputmode="decimal" class="acc-input" data-id="' + a.id + '" value="' + display + '" placeholder="0,00"></div>';
  }).join("");

  openModal(
    '<h3>' + formatMonthLabel(date) + '</h3>' +
    '<div class="subsection-title">Soldes des comptes</div>' +
    accountFields +
    '<p style="font-size:11.5px;color:var(--muted);margin:0.3rem 0 0">Astuce : tu peux taper un calcul (ex. 10+10=) et une virgule ou un point pour les décimales.</p>' +
    '<div class="modal-actions">' +
      '<button class="btn" onclick="closeModal()">Annuler</button>' +
      '<button class="btn btn-primary" data-action="save-month" data-date="' + date + '">Enregistrer</button>' +
    '</div>'
  );
  initSmartNumberInputs(document.getElementById("modal-root"));
}
function saveMonth(date){
  const valeurs = {};
  document.querySelectorAll(".acc-input").forEach(inp => { valeurs[inp.dataset.id] = parseMoneyInput(inp.value); });

  let snapshots = getSnapshots();
  const idx = snapshots.findIndex(s => s.date === date);
  if (idx >= 0) snapshots[idx] = { date, valeurs };
  else snapshots.push({ date, valeurs });
  setSnapshots(snapshots);
  syncAfterChange();

  toast(formatMonthLabel(date) + " enregistré.", "success");
  closeModal();
  render();
}

/* ============ EXPORT / IMPORT / RESET ============ */
function exportData(){
  const data = {
    exportedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
    accounts: getAccounts(),
    snapshots: getSnapshots(),
    categories: getCategories(),
    monthly: getMonthly(),
    settings: getSettings(),
    business: getBusinessData(),
    emploi: getEmploiData()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "finance-export-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Export terminé.", "success");
}
function triggerImport(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        openModal(
          '<h3>Importer ces données ?</h3>' +
          '<p style="font-size:13.5px;color:var(--ink-soft)">Cela remplacera toutes les données actuelles de l\'app par celles du fichier importé.</p>' +
          '<div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button>' +
          '<button class="btn btn-primary" id="confirm-import">Importer</button></div>'
        );
        document.getElementById("confirm-import").onclick = () => {
          if (data.accounts) setAccounts(data.accounts);
          if (data.snapshots) setSnapshots(data.snapshots);
          if (data.categories) saveJSON(STORAGE_KEYS.categories, data.categories);
          if (data.monthly) setMonthly(data.monthly);
          if (data.settings) saveJSON(STORAGE_KEYS.settings, data.settings);
          if (data.business) setBusinessData(data.business);
          if (data.emploi) setEmploiData(data.emploi);
          syncAfterChange();
          toast("Import terminé.", "success");
          closeModal();
          render();
        };
      } catch(err){
        toast("Fichier invalide.", "error");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function resetDataConfirm(){
  openModal(
    '<h3>Réinitialiser toutes les données ?</h3>' +
    '<p style="font-size:13.5px;color:var(--ink-soft)">Cette action est irréversible. Pense à exporter une sauvegarde avant si besoin.</p>' +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button>' +
    '<button class="btn btn-danger" data-action="confirm-reset">Réinitialiser</button></div>'
  );
}
function confirmReset(){
  wipeAllDataAndOnboard();
}

/* ============ HELPERS ============ */
function escapeAttr(str){ return String(str).replace(/"/g,"&quot;"); }

/* ============ FORMULAIRE : MOT DE PASSE ============ */
function openChangePasswordForm(){
  const auth = getAuth() || {};
  openModal(
    '<h3>Modifier le mot de passe</h3>' +
    '<div class="field"><label>Prénom</label><input type="text" id="cp-prenom" value="' + escapeAttr(auth.prenom || "") + '"></div>' +
    '<div class="field"><label>Mot de passe actuel</label><input type="password" id="cp-current" placeholder="Mot de passe actuel"></div>' +
    '<div class="field"><label>Nouveau mot de passe</label><input type="password" id="cp-new" placeholder="Au moins 4 caractères"></div>' +
    '<div class="field"><label>Confirme le nouveau mot de passe</label><input type="password" id="cp-new2" placeholder="Retape le nouveau mot de passe"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn" onclick="closeModal()">Annuler</button>' +
      '<button class="btn btn-primary" data-action="save-password">Enregistrer</button>' +
    '</div>'
  );
}
async function savePasswordChange(){
  const auth = getAuth() || {};
  const prenom = document.getElementById("cp-prenom").value.trim();
  const current = document.getElementById("cp-current").value;
  const next = document.getElementById("cp-new").value;
  const next2 = document.getElementById("cp-new2").value;
  if (!prenom) { toast("Le prénom est requis.", "error"); return; }
  const currentHash = await hashPassword(current, auth.salt);
  if (currentHash !== auth.hash) { toast("Mot de passe actuel incorrect.", "error"); return; }
  if (next.length < 4) { toast("Le nouveau mot de passe doit faire au moins 4 caractères.", "error"); return; }
  if (next !== next2) { toast("Les mots de passe ne correspondent pas.", "error"); return; }
  const salt = randomSalt();
  const hash = await hashPassword(next, salt);
  saveJSON(STORAGE_KEYS.auth, { prenom, salt, hash });
  toast("Mot de passe modifié.", "success");
  closeModal();
  render();
}

/* ============ ÉVÉNEMENTS (délégation globale unique) ============ */
/* Un seul écouteur sur document.body : couvre les vues ET les modales,
   qui sont injectées séparément et ne passent jamais par render(). */
document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const date = el.dataset.date;
  const themePref = el.dataset.themePref;
  const tableId = el.dataset.table;
  const color = el.dataset.color;
  const domain = el.dataset.domain;
  if (action === "go-comptes") setView("comptes");
  else if (action === "go-reglages") setView("reglages");
  else if (action === "add-account") openAccountForm(null);
  else if (action === "edit-account") openAccountForm(id);
  else if (action === "delete-account") deleteAccount(id);
  else if (action === "confirm-delete-account") confirmDeleteAccount(id);
  else if (action === "toggle-account-status") toggleAccountStatus(id);
  else if (action === "toggle-chart-visibility") toggleAccountChartVisibility(id);
  else if (action === "open-reorder-accounts") openReorderAccountsForm();
  else if (action === "move-account-up") moveAccount(id, -1);
  else if (action === "move-account-down") moveAccount(id, 1);
  else if (action === "save-account") saveAccount(id || null);
  else if (action === "new-month") openMonthForm(date);
  else if (action === "edit-month") openMonthForm(date);
  else if (action === "save-month") saveMonth(date);
  else if (action === "export-json") exportData();
  else if (action === "import-json") triggerImport();
  else if (action === "reset-data") resetDataConfirm();
  else if (action === "confirm-reset") confirmReset();
  else if (action === "confirm-forgot-password") wipeAllDataAndOnboard();
  else if (action === "change-password") openChangePasswordForm();
  else if (action === "save-password") savePasswordChange();
  else if (action === "check-update") checkForUpdate(true);
  else if (action === "connect-sync") connectSync(document.getElementById("sync-token-input").value.trim());
  else if (action === "sync-now") syncNow(false);
  else if (action === "disconnect-sync") disconnectSync();
  else if (action === "set-theme") applyTheme(themePref);
  else if (action === "toggle-changelog") toggleChangelog();
  else if (action === "add-flex-column") addFlexColumn(domain, tableId);
  else if (action === "open-reorder-flex-columns") openReorderFlexColumnsForm(domain, tableId);
  else if (action === "move-flex-column-up") moveFlexColumn(domain, tableId, id, -1);
  else if (action === "move-flex-column-down") moveFlexColumn(domain, tableId, id, 1);
  else if (action === "open-reorder-flex-rows") openReorderFlexRowsForm(domain, tableId);
  else if (action === "move-flex-row-up") moveFlexRow(domain, tableId, id, -1);
  else if (action === "move-flex-row-down") moveFlexRow(domain, tableId, id, 1);
  else if (action === "delete-flex-column") deleteFlexColumn(domain, tableId, id);
  else if (action === "add-flex-row") addFlexRow(domain, tableId);
  else if (action === "delete-flex-row") deleteFlexRow(domain, tableId, id);
  else if (action === "add-flex-table") addFlexTable(domain);
  else if (action === "delete-flex-table") deleteFlexTable(domain, tableId);
  else if (action === "confirm-delete-flex-table") confirmDeleteFlexTable(domain, tableId);
  else if (action === "open-row-color-picker") openRowColorPicker(domain, tableId, id);
  else if (action === "set-flex-row-color") setFlexRowColor(domain, tableId, id, color);
  else if (action === "toggle-flex-edit-mode") toggleFlexEditMode(domain);
  else if (action === "open-reorder-flex-tables") openReorderFlexTablesForm(domain);
  else if (action === "move-flex-table-up") moveFlexTable(domain, tableId, -1);
  else if (action === "move-flex-table-down") moveFlexTable(domain, tableId, 1);
  else if (action === "download-template") downloadTemplate(el.dataset.kind);
  else if (action === "download-cv") downloadCV();
});
document.body.addEventListener("change", (e) => {
  if (e.target.classList.contains("business-cell-input")) {
    updateFlexCell(e.target.dataset.domain, e.target.dataset.table, e.target.dataset.row, e.target.dataset.col, e.target.value);
  } else if (e.target.classList.contains("business-col-input")) {
    renameFlexColumn(e.target.dataset.domain, e.target.dataset.table, e.target.dataset.col, e.target.value.trim() || "Colonne");
  } else if (e.target.classList.contains("business-table-title-input")) {
    renameFlexTable(e.target.dataset.domain, e.target.dataset.table, e.target.value.trim() || "Tableau");
  }
});
function attachViewHandlers(){
  if (currentView === "reglages") refreshAppWeight();
}

document.getElementById("nav-version").textContent = "v" + APP_VERSION;
initAuth();
