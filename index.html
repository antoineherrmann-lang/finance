<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance</title>
<meta name="theme-color" content="#1C2430">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EE;
    --paper-alt:#EFEBDD;
    --card:#FFFFFF;
    --ink:#1C2430;
    --ink-soft:#3A4454;
    --muted:#8A8677;
    --border:#E4E0D5;
    --brass:#A9824C;
    --brass-soft:#F0E9DC;
    --brass-text:#7A5A2E;
    --green:#3B6D57;
    --green-soft:#E7EFE9;
    --brick:#8B3A3A;
    --brick-soft:#F5E9E7;
    --radius:10px;
    --sans:'Space Grotesk',sans-serif;
    --serif:'Fraunces',serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  #app{display:flex;min-height:100vh}

  /* Sidebar */
  .sidebar{
    width:210px;flex-shrink:0;background:var(--ink);color:var(--paper);
    display:flex;flex-direction:column;padding:1.5rem 1rem;gap:2px;
    position:sticky;top:0;height:100vh;
  }
  .brand{font-family:var(--serif);font-size:20px;color:var(--paper);margin:0 0 1.75rem 10px;letter-spacing:0.01em}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:7px;
    color:#9BA3AE;font-size:14px;border:none;background:none;text-align:left;width:100%;
    transition:background .15s ease,color .15s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);color:var(--paper)}
  .nav-item.active{background:rgba(169,130,76,0.18);color:#D9B98A}
  .nav-item svg{width:17px;height:17px;flex-shrink:0}
  .nav-spacer{margin-top:auto}
  .nav-version{font-family:var(--mono);font-size:11px;color:#5B6473;padding:10px}

  /* Main */
  main{flex:1;padding:2rem 2.5rem;max-width:960px}
  .page-title{font-family:var(--serif);font-size:24px;margin:0 0 1.25rem 0;color:var(--ink)}
  .row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;gap:1rem;flex-wrap:wrap}

  .btn{
    border:1px solid var(--border);background:var(--card);color:var(--ink);
    padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:500;
    transition:background .15s ease,transform .1s ease;
  }
  .btn:hover{background:var(--paper-alt)}
  .btn:active{transform:scale(0.98)}
  .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn-primary:hover{background:#2A3444}
  .btn-danger{color:var(--brick);border-color:#E3C9C4}
  .btn-danger:hover{background:var(--brick-soft)}
  .btn-ghost{border:none;background:none;padding:6px 8px;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink)}
  .btn-sm{padding:6px 11px;font-size:12.5px}

  .card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem}
  .metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
  .metric-label{font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .metric-value{font-family:var(--mono);font-size:17px;color:var(--ink);font-weight:500}
  .metric-value.pos{color:var(--green)}
  .metric-value.neg{color:var(--brick)}

  .hero-total{font-family:var(--serif);font-size:34px;color:var(--ink);font-weight:500;margin:2px 0 0 0}
  .hero-label{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase}

  .stamp{
    display:inline-flex;align-items:center;gap:6px;background:var(--brass-soft);
    border-radius:20px;padding:5px 13px;font-size:12px;color:var(--brass-text);
    font-family:var(--mono);white-space:nowrap;
  }
  .stamp .dot{width:6px;height:6px;border-radius:50%;border:1px dashed var(--brass)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:0.5px solid var(--border)}
  td{padding:10px 10px;font-size:13.5px;border-bottom:0.5px solid var(--border)}
  tr.list-row{transition:background .12s ease}
  tr.list-row:hover{background:var(--paper-alt)}
  .num{font-family:var(--mono);text-align:right}
  .num.pos{color:var(--green)}
  .num.neg{color:var(--brick)}

  .account-swatch{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}

  .empty-state{padding:3rem 1.5rem;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}
  .empty-state .empty-title{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:6px}
  .empty-state p{font-size:13.5px;margin:0 0 1rem 0}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(28,36,48,0.4);display:flex;align-items:center;
    justify-content:center;z-index:100;opacity:0;transition:opacity .18s ease;padding:1rem;
  }
  .modal-backdrop.open{opacity:1}
  .modal{
    background:var(--card);border-radius:14px;padding:1.5rem 1.5rem;width:100%;max-width:460px;
    max-height:85vh;overflow-y:auto;transform:translateY(8px) scale(0.98);opacity:0;
    transition:transform .18s ease,opacity .18s ease;
  }
  .modal-backdrop.open .modal{transform:translateY(0) scale(1);opacity:1}
  .modal h3{font-family:var(--serif);font-size:19px;margin:0 0 1rem 0;font-weight:500}
  .field{margin-bottom:0.9rem}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .field input,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;
    font-size:14px;background:var(--paper);color:var(--ink);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--brass)}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .swatch.selected{border-color:var(--ink)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem}
  .section-divider{border:none;border-top:0.5px solid var(--border);margin:1.1rem 0}
  .subsection-title{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin:0 0 0.6rem 0}
  .solde-line{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;padding-top:8px}

  /* Toast */
  #toast-container{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
  .toast{
    background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:8px;font-size:13.5px;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);transform:translateX(20px);opacity:0;
    transition:transform .2s ease,opacity .2s ease;max-width:320px;
  }
  .toast.show{transform:translateX(0);opacity:1}
  .toast.success{background:var(--green)}
  .toast.error{background:var(--brick)}

  .just-added{animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  .changelog-item{padding:10px 0;border-bottom:0.5px solid var(--border)}
  .changelog-item:last-child{border-bottom:none}
  .changelog-version{font-family:var(--mono);font-size:12.5px;color:var(--brass-text);margin-bottom:3px}
  .changelog-notes{font-size:13.5px;color:var(--ink-soft);margin:0}

  .settings-list .card{margin-bottom:12px}
  .settings-row{display:flex;justify-content:space-between;align-items:center}
  .settings-row .desc{font-size:12.5px;color:var(--muted);margin-top:2px}

  @media (max-width:760px){
    #app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:1rem;overflow-x:auto}
    .brand{display:none}
    .nav-spacer{display:none}
    .nav-version{display:none}
    main{padding:1.25rem 1.25rem;max-width:100%}
    .metrics-grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<div id="app">
  <nav class="sidebar">
    <div class="brand">Finance</div>
    <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Tableau de bord</button>
    <button class="nav-item" data-view="comptes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>Comptes</button>
    <button class="nav-item" data-view="mois"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>Mois</button>
    <div class="nav-spacer"></div>
    <button class="nav-item" data-view="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>Réglages</button>
    <div class="nav-version" id="nav-version"></div>
  </nav>
  <main id="view"></main>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

<script>
/* ============ VERSION & MISE À JOUR (identique au système MADA) ============ */
const APP_VERSION = "1.0.0";

async function checkForUpdate(manual){
  try{
    const res = await fetch("./index.html?_=" + Date.now(), { cache: "no-store" });
    const text = await res.text();
    const match = text.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if (match && match[1] !== APP_VERSION) {
      toast("Nouvelle version disponible, mise à jour…", "success");
      setTimeout(() => {
        location.href = location.pathname + "?v=" + match[1] + "&_=" + Date.now();
      }, 1100);
    } else if (manual) {
      toast("Vous avez déjà la dernière version.", "success");
    }
  } catch(e){
    if (manual) toast("Impossible de vérifier les mises à jour.", "error");
  }
}

/* ============ CHANGELOG ============ */
const CHANGELOG = [
  { version: "1.0.0", date: "2026-08-04", notes: "Première version : comptes, saisie mensuelle, tableau de bord, export/import." }
];

/* ============ ÉTAT & STOCKAGE ============ */
const STORAGE_KEYS = {
  accounts: "finance_accounts",
  snapshots: "finance_snapshots",
  categories: "finance_categories",
  monthly: "finance_monthly",
  settings: "finance_settings"
};

const DEFAULT_CATEGORIES = [
  { id: "cat_salaire", nom: "Salaire", sens: "entree" },
  { id: "cat_aides", nom: "Aides", sens: "entree" },
  { id: "cat_revsupp", nom: "Revenus supplémentaires", sens: "entree" },
  { id: "cat_logement", nom: "Logement", sens: "sortie" },
  { id: "cat_courses", nom: "Courses", sens: "sortie" },
  { id: "cat_transport", nom: "Transport", sens: "sortie" },
  { id: "cat_abonnements", nom: "Abonnements", sens: "sortie" },
  { id: "cat_loisirs", nom: "Loisirs", sens: "sortie" },
  { id: "cat_dettes", nom: "Dettes", sens: "sortie" },
  { id: "cat_epargne", nom: "Épargne et investissements", sens: "sortie" },
  { id: "cat_autres", nom: "Autres", sens: "sortie" }
];

const ACCOUNT_COLORS = ["#A9824C", "#3B6D57", "#8B3A3A", "#4A5C7A", "#7A6A9C", "#8A8677"];

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ toast("Impossible d'enregistrer les données.", "error"); return false; }
}

function getAccounts(){ return loadJSON(STORAGE_KEYS.accounts, []); }
function setAccounts(v){ saveJSON(STORAGE_KEYS.accounts, v); }
function getSnapshots(){ return loadJSON(STORAGE_KEYS.snapshots, []).sort((a,b)=>a.date.localeCompare(b.date)); }
function setSnapshots(v){ saveJSON(STORAGE_KEYS.snapshots, v); }
function getCategories(){
  let cats = loadJSON(STORAGE_KEYS.categories, null);
  if (!cats) { cats = DEFAULT_CATEGORIES; saveJSON(STORAGE_KEYS.categories, cats); }
  return cats;
}
function getMonthly(){ return loadJSON(STORAGE_KEYS.monthly, []).sort((a,b)=>a.date.localeCompare(b.date)); }
function setMonthly(v){ saveJSON(STORAGE_KEYS.monthly, v); }
function getSettings(){ return loadJSON(STORAGE_KEYS.settings, { clotureJour: 20 }); }

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

/* ============ UTILITAIRES ============ */
function formatEUR(n){
  if (n === null || n === undefined || isNaN(n)) n = 0;
  return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}
function formatEURShort(n){
  if (n === null || n === undefined || isNaN(n)) n = 0;
  return Math.round(n).toLocaleString("fr-FR") + " €";
}
const MONTH_NAMES = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function formatMonthLabel(dateStr){
  const [y,m] = dateStr.split("-").map(Number);
  return MONTH_NAMES[m-1].charAt(0).toUpperCase() + MONTH_NAMES[m-1].slice(1) + " " + y;
}
function currentMonthStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function shiftMonth(dateStr, delta){
  let [y,m] = dateStr.split("-").map(Number);
  m += delta;
  while (m > 12) { m -= 12; y += 1; }
  while (m < 1) { m += 12; y -= 1; }
  return y + "-" + String(m).padStart(2,"0");
}
function computeSnapshotTotal(snapshot, accounts){
  return accounts.reduce((sum, a) => sum + (Number(snapshot.valeurs[a.id]) || 0), 0);
}
function sumLignes(lignes, categories, sens){
  return categories.filter(c => c.sens === sens).reduce((s,c) => s + (Number(lignes[c.id]) || 0), 0);
}

/* ============ NAVIGATION ============ */
let currentView = "dashboard";

function setView(view){
  currentView = view;
  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  render();
}
document.querySelectorAll(".nav-item").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));

/* ============ TOAST ============ */
function toast(message, type){
  const container = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, 3200);
}

/* ============ MODALE ============ */
function closeModal(){
  const backdrop = document.querySelector(".modal-backdrop");
  if (!backdrop) return;
  backdrop.classList.remove("open");
  setTimeout(() => { document.getElementById("modal-root").innerHTML = ""; }, 160);
}
function openModal(html){
  document.getElementById("modal-root").innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">' + html + '</div></div>';
  requestAnimationFrame(() => document.querySelector(".modal-backdrop").classList.add("open"));
}

/* ============ RENDU PRINCIPAL ============ */
function render(){
  const view = document.getElementById("view");
  if (currentView === "dashboard") view.innerHTML = renderDashboard();
  else if (currentView === "comptes") view.innerHTML = renderComptes();
  else if (currentView === "mois") view.innerHTML = renderMois();
  else if (currentView === "reglages") view.innerHTML = renderReglages();
  attachViewHandlers();
}

/* ============ VUE : TABLEAU DE BORD ============ */
function renderDashboard(){
  const accounts = getAccounts();
  const snapshots = getSnapshots();
  const settings = getSettings();

  if (accounts.length === 0) {
    return '<h1 class="page-title">Tableau de bord</h1>' + emptyState(
      "Aucun compte pour l'instant",
      "Ajoute au moins un compte pour commencer à suivre ton patrimoine.",
      '<button class="btn btn-primary" data-action="go-comptes">Ajouter un compte</button>'
    );
  }

  const last = snapshots[snapshots.length - 1];
  const prev = snapshots[snapshots.length - 2];
  const total = last ? computeSnapshotTotal(last, accounts) : 0;
  const diff = (last && prev) ? total - computeSnapshotTotal(prev, accounts) : null;

  const thisYear = new Date().getFullYear();
  const yearSnaps = snapshots.filter(s => s.date.startsWith(String(thisYear)));
  let avg = null;
  if (yearSnaps.length >= 2) {
    const diffs = [];
    for (let i=1;i<yearSnaps.length;i++){
      diffs.push(computeSnapshotTotal(yearSnaps[i],accounts) - computeSnapshotTotal(yearSnaps[i-1],accounts));
    }
    avg = diffs.reduce((a,b)=>a+b,0) / diffs.length;
  }

  const today = new Date();
  const currentMonth = currentMonthStr();
  const hasCurrentMonth = snapshots.some(s => s.date === currentMonth);
  const closureNear = today.getDate() >= (settings.clotureJour - 3) && !hasCurrentMonth;

  return '' +
  '<div class="row-between">' +
    '<div>' +
      '<div class="hero-label">' + (last ? formatMonthLabel(last.date) : "Aucune donnée") + '</div>' +
      '<div class="hero-total">' + formatEUR(total) + '</div>' +
    '</div>' +
    (closureNear ?
      '<span class="stamp"><span class="dot"></span>clôture le ' + settings.clotureJour + '</span>' :
      (hasCurrentMonth ? '<span class="stamp"><span class="dot"></span>mois clôturé</span>' : '')
    ) +
  '</div>' +
  '<div class="metrics-grid">' +
    metricCard("Variation du mois", diff === null ? "—" : (diff>=0?"+":"") + formatEURShort(diff), diff===null?"":(diff>=0?"pos":"neg")) +
    metricCard("Moyenne " + thisYear, avg === null ? "—" : (avg>=0?"+":"") + formatEURShort(avg) + "/mois", avg===null?"":(avg>=0?"pos":"neg")) +
    metricCard("Comptes suivis", String(accounts.length), "") +
  '</div>' +
  '<div class="card" style="margin-bottom:1.5rem">' +
    '<div class="subsection-title">Évolution du patrimoine</div>' +
    (snapshots.length >= 2 ? evolutionChart(snapshots, accounts) : '<p style="color:var(--muted);font-size:13.5px">Ajoute au moins deux mois pour voir la courbe.</p>') +
  '</div>' +
  (snapshots.length > 0 ?
    '<div class="card">' +
      '<div class="subsection-title">Derniers mois</div>' +
      '<table><tbody>' +
        snapshots.slice(-6).reverse().map((s,i,arr) => {
          const idxInFull = snapshots.indexOf(s);
          const p = snapshots[idxInFull-1];
          const t = computeSnapshotTotal(s, accounts);
          const d = p ? t - computeSnapshotTotal(p, accounts) : null;
          return '<tr class="list-row"><td>' + formatMonthLabel(s.date) + '</td>' +
            '<td class="num">' + formatEUR(t) + '</td>' +
            '<td class="num ' + (d===null?'':(d>=0?'pos':'neg')) + '">' + (d===null?'—':(d>=0?'+':'')+formatEURShort(d)) + '</td></tr>';
        }).join("") +
      '</tbody></table>' +
    '</div>' : ''
  );
}

function metricCard(label, value, cls){
  return '<div class="card"><div class="metric-label">' + label + '</div><div class="metric-value ' + cls + '">' + value + '</div></div>';
}

function emptyState(title, desc, actionHtml){
  return '<div class="empty-state"><div class="empty-title">' + title + '</div><p>' + desc + '</p>' + (actionHtml||'') + '</div>';
}

function evolutionChart(snapshots, accounts){
  const w = 640, h = 190, padL = 44, padR = 10, padT = 14, padB = 24;
  const totals = snapshots.map(s => computeSnapshotTotal(s, accounts));
  const min = Math.min(0, ...totals);
  const max = Math.max(...totals) * 1.08 || 1;
  const x = i => padL + (i / (snapshots.length - 1)) * (w - padL - padR);
  const y = v => padT + (1 - (v - min) / (max - min)) * (h - padT - padB);
  let path = "M " + x(0) + " " + y(totals[0]);
  for (let i=1;i<totals.length;i++) path += " L " + x(i) + " " + y(totals[i]);
  const areaPath = path + " L " + x(totals.length-1) + " " + y(min) + " L " + x(0) + " " + y(min) + " Z";

  const gridLines = [];
  for (let i=0;i<=3;i++){
    const v = min + (max-min)*i/3;
    gridLines.push('<line x1="' + padL + '" y1="' + y(v) + '" x2="' + (w-padR) + '" y2="' + y(v) + '" stroke="#EFEBDD" stroke-width="1"/>' +
      '<text x="' + (padL-8) + '" y="' + (y(v)+3) + '" text-anchor="end" font-size="10.5" fill="#8A8677" font-family="IBM Plex Mono, monospace">' + Math.round(v/1000) + 'k</text>');
  }

  const labelStep = Math.max(1, Math.ceil(snapshots.length / 7));
  const xLabels = snapshots.map((s,i) => (i % labelStep === 0 || i === snapshots.length-1) ?
    '<text x="' + x(i) + '" y="' + (h-6) + '" text-anchor="middle" font-size="10" fill="#8A8677" font-family="Space Grotesk, sans-serif">' + s.date.slice(2) + '</text>' : '').join("");

  return '<div style="position:relative;width:100%;overflow-x:auto"><svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;min-width:480px;height:' + h + 'px" role="img" aria-label="Courbe d\'évolution du patrimoine total">' +
    gridLines.join("") +
    '<path d="' + areaPath + '" fill="#A9824C" opacity="0.1"/>' +
    '<path d="' + path + '" fill="none" stroke="#A9824C" stroke-width="2"/>' +
    '<circle cx="' + x(totals.length-1) + '" cy="' + y(totals[totals.length-1]) + '" r="3.5" fill="#A9824C"/>' +
    xLabels +
  '</svg></div>';
}

/* ============ VUE : COMPTES ============ */
function renderComptes(){
  const accounts = getAccounts();
  const snapshots = getSnapshots();
  const last = snapshots[snapshots.length - 1];

  const rows = accounts.map(a => {
    const solde = last ? (Number(last.valeurs[a.id]) || 0) : 0;

      '<td style="text-align:right">' +
        '<button class="btn-ghost btn-sm" data-action="edit-account" data-id="' + a.id + '">Modifier</button>' +
        '<button class="btn-ghost btn-sm" data-action="delete-account" data-id="' + a.id + '">Supprimer</button>' +

    (accounts.length === 0 ?

      '<div class="card"><table><thead><tr><th>Nom</th><th>Type</th><th style="text-align:right">Solde actuel</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
    );
}

/* ============ VUE : MOIS ============ */
function renderMois(){
  const accounts = getAccounts();
  const snapshots = getSnapshots();
  const monthly = getMonthly();

  if (accounts.length === 0) {
    return '<h1 class="page-title">Mois</h1>' + emptyState(
      "Ajoute d'abord un compte",
      "La saisie mensuelle a besoin d'au moins un compte pour fonctionner.",
      '<button class="btn btn-primary" data-action="go-comptes">Ajouter un compte</button>'
    );
  }

  const nextMonth = snapshots.length ? shiftMonth(snapshots[snapshots.length-1].date, 1) : currentMonthStr();

  const rows = snapshots.slice().reverse().map((s, revIdx) => {
    const idx = snapshots.length - 1 - revIdx;
    const prev = snapshots[idx-1];
    const total = computeSnapshotTotal(s, accounts);
    const diff = prev ? total - computeSnapshotTotal(prev, accounts) : null;
    const m = monthly.find(x => x.date === s.date);
    const closed = s.date < currentMonthStr();
    const categories = getCategories();
    const solde = m ? (sumLignes(m.lignes, categories, "entree") - sumLignes(m.lignes, categories, "sortie")) : null;
    return '<tr class="list-row">' +
      '<td>' + formatMonthLabel(s.date) + (closed ? ' <span class="stamp" style="padding:2px 8px;font-size:10.5px;margin-left:6px"><span class="dot" style="width:5px;height:5px"></span>clôturé</span>' : '') + '</td>' +
      '<td class="num">' + formatEUR(total) + '</td>' +
      '<td class="num ' + (diff===null?'':(diff>=0?'pos':'neg')) + '">' + (diff===null?'—':(diff>=0?'+':'')+formatEURShort(diff)) + '</td>' +
      '<td class="num ' + (solde===null?'':(solde>=0?'pos':'neg')) + '">' + (solde===null?'—':formatEURShort(solde)) + '</td>' +
      '<td style="text-align:right"><button class="btn-ghost btn-sm" data-action="edit-month" data-date="' + s.date + '">Modifier</button></td>' +
    '</tr>';
  }).join("");

  return '<div class="row-between"><h1 class="page-title" style="margin:0">Mois</h1>' +
    '<button class="btn btn-primary" data-action="new-month" data-date="' + nextMonth + '">+ Nouveau mois (' + formatMonthLabel(nextMonth) + ')</button></div>' +
    (snapshots.length === 0 ?
      emptyState("Aucun mois enregistré", "Crée ton premier mois pour saisir les soldes de tes comptes.", '<button class="btn btn-primary" data-action="new-month" data-date="' + nextMonth + '">Créer ' + formatMonthLabel(nextMonth) + '</button>') :
      '<div class="card"><table><thead><tr><th>Mois</th><th style="text-align:right">Total</th><th style="text-align:right">Variation</th><th style="text-align:right">Solde du mois</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
    );
}

/* ============ VUE : RÉGLAGES ============ */

  return '<h1 class="page-title">Réglages</h1>' +
  '<div class="settings-list">' +
    '<div class="card"><div class="settings-row">' +
      '<div><div style="font-weight:500;font-size:14px">Sauvegarde des données</div><div class="desc">Exporter ou importer toutes tes données au format JSON.</div></div>' +
      '<div style="display:flex;gap:8px"><button class="btn btn-sm" data-action="export-json">Exporter</button><button class="btn btn-sm" data-action="import-json">Importer</button></div>' +
    '</div></div>' +
    '<div class="card"><div class="settings-row">' +
      '<div><div style="font-weight:500;font-size:14px">Mises à jour</div><div class="desc">Version actuelle : <span style="font-family:var(--mono)">' + APP_VERSION + '</span></div></div>' +
      '<button class="btn btn-sm" data-action="check-update">Rechercher une mise à jour</button>' +
    '</div></div>' +
    '<div class="card"><div class="settings-row">' +
      '<div><div style="font-weight:500;font-size:14px">Poids de l\'app</div><div class="desc" id="app-weight">Calcul en cours…</div></div>' +
    '</div></div>' +
    '<div class="card"><div style="font-weight:500;font-size:14px;margin-bottom:8px">Changelog</div>' +
      CHANGELOG.slice().reverse().map(c => '<div class="changelog-item"><div class="changelog-version">v' + c.version + ' — ' + c.date + '</div><p class="changelog-notes">' + c.notes + '</p></div>').join("") +
    '</div>' +
    '<div class="card" style="border-color:#E3C9C4"><div class="settings-row">' +
      '<div><div style="font-weight:500;font-size:14px;color:var(--brick)">Réinitialiser les données</div><div class="desc">Supprime tous les comptes, mois et réglages de cet appareil.</div></div>' +
      '<button class="btn btn-danger btn-sm" data-action="reset-data">Réinitialiser</button>' +
    '</div></div>' +
  '</div>';
}

async function refreshAppWeight(){
  try{
    const res = await fetch("./index.html", { cache: "no-store" });
    const blob = await res.blob();
    const kb = (blob.size / 1024).toFixed(1);
    const el = document.getElementById("app-weight");
    if (el) el.textContent = kb + " Ko";
  } catch(e){
    const el = document.getElementById("app-weight");
    if (el) el.textContent = "Indisponible";
  }
}

/* ============ FORMULAIRES : COMPTES ============ */
function openAccountForm(existingId){
  const accounts = getAccounts();
  const acc = accounts.find(a => a.id === existingId);
  const colorSwatches = ACCOUNT_COLORS.map(c =>
    '<div class="swatch ' + (acc && acc.couleur===c || (!acc && c===ACCOUNT_COLORS[0]) ? 'selected' : '') + '" style="background:' + c + '" data-color="' + c + '" onclick="selectSwatch(this)"></div>'
  ).join("");

  openModal(
    '<h3>' + (acc ? "Modifier le compte" : "Ajouter un compte") + '</h3>' +
    '<div class="field"><label>Nom du compte</label><input type="text" id="f-nom" value="' + (acc ? escapeAttr(acc.nom) : '') + '" placeholder="Ex. Livret A"></div>' +
    '<div class="field"><label>Type</label><select id="f-type">' +
      ["Courant","Épargne","Livret","Assurance vie","Autre"].map(t => '<option ' + (acc && acc.type===t ? 'selected':'') + '>' + t + '</option>').join("") +
    '</select></div>' +
    '<div class="field"><label>Couleur</label><div class="swatches">' + colorSwatches + '</div></div>' +
    '<div class="modal-actions">' +
      '<button class="btn" onclick="closeModal()">Annuler</button>' +
      '<button class="btn btn-primary" data-action="save-account" data-id="' + (existingId||'') + '">Enregistrer</button>' +
    '</div>'
  );
}
function selectSwatch(el){
  el.parentElement.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
}
function saveAccount(existingId){
  const nom = document.getElementById("f-nom").value.trim();
  const type = document.getElementById("f-type").value;
  const colorEl = document.querySelector(".swatch.selected");
  const couleur = colorEl ? colorEl.dataset.color : ACCOUNT_COLORS[0];
  if (!nom) { toast("Le nom du compte est requis.", "error"); return; }
  let accounts = getAccounts();
  if (existingId) {
    accounts = accounts.map(a => a.id === existingId ? { ...a, nom, type, couleur } : a);
    toast("Compte modifié.", "success");
  } else {
    accounts.push({ id: uid("acc"), nom, type, couleur });
    toast("Compte ajouté.", "success");
  }
  setAccounts(accounts);
  closeModal();
  render();
}
function deleteAccount(id){
  openModal(
    '<h3>Supprimer ce compte ?</h3>' +
    '<p style="font-size:13.5px;color:var(--ink-soft)">Les valeurs enregistrées pour ce compte dans l\'historique des mois seront conservées mais ne seront plus affichées.</p>' +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button>' +
    '<button class="btn btn-danger" data-action="confirm-delete-account" data-id="' + id + '">Supprimer</button></div>'
  );
}
function confirmDeleteAccount(id){
  setAccounts(getAccounts().filter(a => a.id !== id));
  toast("Compte supprimé.", "success");
  closeModal();
  render();
}

/* ============ FORMULAIRES : MOIS ============ */
function openMonthForm(date){
  const accounts = getAccounts();
  const categories = getCategories();
  const snapshots = getSnapshots();
  const monthly = getMonthly();
  const existingSnap = snapshots.find(s => s.date === date);
  const existingMonthly = monthly.find(m => m.date === date);
  const prevSnap = snapshots.filter(s => s.date < date).sort((a,b)=>b.date.localeCompare(a.date))[0];

  const accountFields = accounts.map(a => {
    const val = existingSnap ? existingSnap.valeurs[a.id] : (prevSnap ? prevSnap.valeurs[a.id] : "");
    return '<div class="field"><label><span class="account-swatch" style="background:' + a.couleur + '"></span>' + a.nom + '</label>' +
      '<input type="number" step="0.01" class="acc-input" data-id="' + a.id + '" value="' + (val !== undefined && val !== "" ? val : "") + '" placeholder="0.00"></div>';
  }).join("");

  const entreeFields = categories.filter(c => c.sens === "entree").map(c => {
    const val = existingMonthly ? existingMonthly.lignes[c.id] : "";
    return catField(c, val);
  }).join("");
  const sortieFields = categories.filter(c => c.sens === "sortie").map(c => {
    const val = existingMonthly ? existingMonthly.lignes[c.id] : "";
    return catField(c, val);
  }).join("");

  openModal(
    '<h3>' + formatMonthLabel(date) + '</h3>' +
    '<div class="subsection-title">Soldes des comptes</div>' +
    accountFields +
    '<hr class="section-divider">' +
    '<div class="subsection-title">Entrées d\'argent</div>' +
    entreeFields +
    '<hr class="section-divider">' +
    '<div class="subsection-title">Sorties d\'argent</div>' +
    sortieFields +
    '<div class="modal-actions">' +
      '<button class="btn" onclick="closeModal()">Annuler</button>' +
      '<button class="btn btn-primary" data-action="save-month" data-date="' + date + '">Enregistrer</button>' +
    '</div>'
  );
}
function catField(c, val){
  return '<div class="field"><label>' + c.nom + '</label>' +
    '<input type="number" step="0.01" class="cat-input" data-id="' + c.id + '" value="' + (val !== undefined && val !== "" ? val : "") + '" placeholder="0.00"></div>';
}
function saveMonth(date){
  const valeurs = {};
  document.querySelectorAll(".acc-input").forEach(inp => { valeurs[inp.dataset.id] = parseFloat(inp.value) || 0; });
  const lignes = {};
  document.querySelectorAll(".cat-input").forEach(inp => { lignes[inp.dataset.id] = parseFloat(inp.value) || 0; });

  let snapshots = getSnapshots();
  const idx = snapshots.findIndex(s => s.date === date);
  if (idx >= 0) snapshots[idx] = { date, valeurs };
  else snapshots.push({ date, valeurs });
  setSnapshots(snapshots);

  let monthly = getMonthly();
  const midx = monthly.findIndex(m => m.date === date);
  if (midx >= 0) monthly[midx] = { date, lignes };
  else monthly.push({ date, lignes });
  setMonthly(monthly);

  toast(formatMonthLabel(date) + " enregistré.", "success");
  closeModal();
  render();
}

/* ============ EXPORT / IMPORT / RESET ============ */
function exportData(){
  const data = {
    exportedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
    accounts: getAccounts(),
    snapshots: getSnapshots(),
    categories: getCategories(),
    monthly: getMonthly(),
    settings: getSettings()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "finance-export-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Export terminé.", "success");
}
function triggerImport(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        openModal(
          '<h3>Importer ces données ?</h3>' +
          '<p style="font-size:13.5px;color:var(--ink-soft)">Cela remplacera toutes les données actuelles de l\'app par celles du fichier importé.</p>' +
          '<div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button>' +
          '<button class="btn btn-primary" id="confirm-import">Importer</button></div>'
        );
        document.getElementById("confirm-import").onclick = () => {
          if (data.accounts) setAccounts(data.accounts);
          if (data.snapshots) setSnapshots(data.snapshots);
          if (data.categories) saveJSON(STORAGE_KEYS.categories, data.categories);
          if (data.monthly) setMonthly(data.monthly);
          if (data.settings) saveJSON(STORAGE_KEYS.settings, data.settings);
          toast("Import terminé.", "success");
          closeModal();
          render();
        };
      } catch(err){
        toast("Fichier invalide.", "error");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function resetDataConfirm(){
  openModal(
    '<h3>Réinitialiser toutes les données ?</h3>' +
    '<p style="font-size:13.5px;color:var(--ink-soft)">Cette action est irréversible. Pense à exporter une sauvegarde avant si besoin.</p>' +
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button>' +
    '<button class="btn btn-danger" data-action="confirm-reset">Réinitialiser</button></div>'
  );
}
function confirmReset(){
  Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
  toast("Données réinitialisées.", "success");
  closeModal();
  setView("dashboard");
}

/* ============ HELPERS ============ */
function escapeAttr(str){ return String(str).replace(/"/g,"&quot;"); }

/* ============ ÉVÉNEMENTS (délégation globale unique) ============ */
/* Un seul écouteur sur document.body : couvre les vues ET les modales,
   qui sont injectées séparément et ne passent jamais par render(). */
document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const date = el.dataset.date;
  if (action === "go-comptes") setView("comptes");
  else if (action === "add-account") openAccountForm(null);
  else if (action === "edit-account") openAccountForm(id);
  else if (action === "delete-account") deleteAccount(id);
  else if (action === "confirm-delete-account") confirmDeleteAccount(id);
  else if (action === "save-account") saveAccount(id || null);
  else if (action === "new-month") openMonthForm(date);
  else if (action === "edit-month") openMonthForm(date);
  else if (action === "save-month") saveMonth(date);
  else if (action === "export-json") exportData();
  else if (action === "import-json") triggerImport();
  else if (action === "reset-data") resetDataConfirm();
  else if (action === "confirm-reset") confirmReset();
  else if (action === "check-update") checkForUpdate(true);
});
function attachViewHandlers(){
  if (currentView === "reglages") refreshAppWeight();
}

/* ============ INITIALISATION ============ */
document.getElementById("nav-version").textContent = "v" + APP_VERSION;
setView("dashboard");
checkForUpdate(false);
</script>
